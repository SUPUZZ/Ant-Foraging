name: Build Ant Field

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows x64 desktop
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish desktop app
        run: ./desktop/build.ps1
      - name: Upload portable desktop app
        uses: actions/upload-artifact@v7
        with:
          name: AntField-windows-x64
          path: desktop/artifacts/windows-x64/AntField.exe
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test simulation
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: AntField-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 30
