<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import * as THREE from 'three';
import { createAnt } from '/src/ant-model.js';
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(192, 128); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.45;
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xfff1d6, 0x494a38, 2.6));
const light = new THREE.DirectionalLight(0xffe0b1, 3.4); light.position.set(-2, 5, -3); scene.add(light);
const camera = new THREE.OrthographicCamera(-2, 2, 4 / 3, -4 / 3, .1, 30);
camera.position.set(0, 12, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0);
const ant = createAnt(); scene.add(ant.root);
const sheet = document.createElement('canvas'); sheet.width = 25 * 192; sheet.height = 2 * 128;
const ctx = sheet.getContext('2d');
for (let row = 0; row < 2; row++) for (let frame = 0; frame < 25; frame++) {
  const phase = frame < 24 ? frame / 24 * Math.PI * 2 : 0;
  ant.animate(phase / 5.5, phase / 8, row === 1, frame < 24);
  renderer.render(scene, camera); ctx.drawImage(renderer.domElement, frame * 192, row * 128);
}
window.antAtlas = sheet.toDataURL('image/png');
renderer.dispose(); ant.dispose();
</script></body></html>
